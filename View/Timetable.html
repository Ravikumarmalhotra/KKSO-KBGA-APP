<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kolkata Metro – Orange Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --up:#2bb8ff;  --up-rgb:43,184,255;
  --dn:#c653ff;  --dn-rgb:198,83,255;
  --orange:#ff8a1f;
  --ink:#e6eeff; --muted:#7f8fb3; --bg:#050914;
  --glass:rgba(13,21,44,.72);
  --digit:'Orbitron','Rajdhani',ui-monospace,monospace;      /* headings / labels */
  --num:'Share Tech Mono','Orbitron',ui-monospace,monospace;  /* card digits (P1 & P2) */
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;
  font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:600;
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 8% -10%,rgba(43,184,255,.18),transparent 60%),
    radial-gradient(800px 520px at 100% 0%,rgba(198,83,255,.16),transparent 60%),
    radial-gradient(900px 600px at 50% 120%,rgba(255,138,31,.13),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
/* tech grid overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(120,160,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,255,.05) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);
          mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:1250px;margin:auto;padding:14px;flex:1}

/* ---------- glass panels ---------- */
.glass,.card{
  position:relative;
  background:var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-radius:16px;overflow:hidden;
}
.controls{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;
  border:1px solid rgba(255,138,31,.45);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.45),0 0 26px rgba(255,138,31,.15);
}
.controls label{
  font-family:var(--digit);font-weight:700;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--orange);text-shadow:0 0 12px rgba(255,138,31,.7);
}
select{
  -webkit-appearance:none;appearance:none;
  flex:1;min-width:250px;padding:12px 44px 12px 14px;
  font:inherit;font-weight:700;font-size:18px;letter-spacing:.4px;color:var(--ink);
  background:#0a1228 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='10' viewBox='0 0 16 10'><path d='M1 1l7 7 7-7' fill='none' stroke='%23ff8a1f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
  border:1px solid rgba(255,138,31,.55);border-radius:12px;outline:none;
  box-shadow:0 0 14px rgba(255,138,31,.18) inset;
  transition:box-shadow .25s,border-color .25s;
}
select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.25),0 0 18px rgba(255,138,31,.3) inset}
select option{background:#0a1228;color:var(--ink)}
select option:disabled{color:#5d6b8c}

.grid{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* ---------- UP / DN cards ---------- */
.card{
  margin-bottom:14px;
  border:1px solid rgba(var(--c-rgb),.40);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(var(--c-rgb),.16);
}
.dirUP{--c:var(--up);--c-rgb:var(--up-rgb)}
.dirDN{--c:var(--dn);--c-rgb:var(--dn-rgb)}
/* moving light on top edge */
.card::before{
  content:"";position:absolute;top:0;left:-40%;width:40%;height:2px;z-index:2;
  background:linear-gradient(90deg,transparent,var(--c),transparent);
  box-shadow:0 0 12px var(--c);
  animation:sweep 3.6s linear infinite;
}
@keyframes sweep{to{left:100%}}

.hd{
  display:flex;gap:14px;align-items:center;padding:12px 16px;
  background:linear-gradient(90deg,rgba(var(--c-rgb),.34),rgba(var(--c-rgb),.04) 85%);
  border-bottom:1px solid rgba(var(--c-rgb),.38);
}
.hd .big{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:15px;color:var(--c);background:rgba(var(--c-rgb),.12);
  border:1px solid var(--c);box-shadow:0 0 14px rgba(var(--c-rgb),.65),0 0 8px rgba(var(--c-rgb),.4) inset;
  text-shadow:0 0 8px var(--c);
}
.hd b{font-family:var(--digit);font-size:16px;letter-spacing:3px;color:#fff;text-shadow:0 0 12px rgba(var(--c-rgb),.9)}
.hd small{display:block;margin-top:2px;font-size:15px;font-weight:600;letter-spacing:.6px;color:#b9c7ea}

/* card split: left Time1 + countdown + bar | right Time2 */
.split{display:grid;grid-template-columns:1.5fr 1fr}
.p1{padding:14px 16px 16px;min-width:0}
.p2{
  padding:14px 12px;min-width:0;
  background:linear-gradient(180deg,rgba(var(--c-rgb),.14),rgba(var(--c-rgb),.04));
  border-left:1px dashed rgba(var(--c-rgb),.6);
  display:flex;align-items:flex-start;
}
/* ---- digits of P1 & P2 use --num font ---- */
.t1{
  font-family:var(--num);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:clamp(28px,8vw,42px);line-height:1.15;color:#fff;letter-spacing:1px;
  text-shadow:0 0 16px rgba(var(--c-rgb),.85),0 0 2px rgba(255,255,255,.6);
}
.cd{
  font-family:var(--num);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:24px;margin:8px 0 12px;letter-spacing:2px;
  text-shadow:0 0 14px currentColor;transition:color .5s;
}
.t2{
  font-family:var(--num);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:clamp(15px,5vw,22px);line-height:1.3;color:var(--c);letter-spacing:1px;
  text-shadow:0 0 12px rgba(var(--c-rgb),.8);
}
.bar{
  height:9px;border-radius:6px;overflow:hidden;
  background:rgba(255,255,255,.07);
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset;
}
.bar i{display:block;height:100%;border-radius:6px;box-shadow:0 0 12px 1px currentColor}
.tag{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;vertical-align:middle;
  font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#ffb366;background:rgba(255,138,31,.14);border:1px solid rgba(255,138,31,.5);text-shadow:none;
}
.na{
  padding:26px 16px;text-align:center;
  font-family:var(--digit);font-size:46px;font-weight:800;letter-spacing:6px;
  color:#3b4868;text-shadow:0 0 18px rgba(127,143,179,.25);
}

/* ---------- map ---------- */
.mapcard{
  padding:12px;
  border:1px solid rgba(255,138,31,.38);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(255,138,31,.12);
}
.mapcard h3{
  margin:4px 6px 2px;display:flex;align-items:center;gap:10px;
  font-family:var(--digit);font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--orange);
  text-shadow:0 0 12px rgba(255,138,31,.7);
}
.live{
  width:9px;height:9px;border-radius:50%;background:#2dff7a;box-shadow:0 0 10px #2dff7a;
  animation:lv 1.4s infinite;
}
@keyframes lv{50%{opacity:.25;box-shadow:0 0 2px #2dff7a}}
#map{width:100%;max-height:86vh;display:block}

.trk{fill:none;stroke-width:3;stroke-linecap:round}
.tUP{stroke:var(--up)} .tDN{stroke:var(--dn)}
.aUP{fill:var(--up)} .aDN{fill:var(--dn)}
.rUP{stroke:var(--up)} .rDN{stroke:var(--dn)}
.lUP{fill:var(--up)} .lDN{fill:var(--dn)}
.lUP,.lDN{stroke:#050914;stroke-width:3.2px;paint-order:stroke;stroke-linejoin:round}
.stn{cursor:pointer}
.stn.off{cursor:not-allowed}
.sn{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;fill:#e6eeff;letter-spacing:.3px}
.sc{font-size:10.5px;font-weight:600;fill:#7f8fb3;letter-spacing:1px}
.si{font-size:11.5px;fill:#ffb366;font-weight:700}
.stn.off text{fill:#566385}
.stn.sel .sn{fill:#ffa84d;font-size:15px}
.pulse{display:none;fill:none;stroke:#ff8a1f;stroke-width:3;transform-box:fill-box;transform-origin:center}
.stn.sel .pulse{display:block;animation:pl 1.3s infinite}
@keyframes pl{0%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
.ring{fill:none;stroke-width:2.5;stroke-dasharray:4 3}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:14px;padding:8px 6px;color:#aab8d8}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block}

.running{padding:6px 6px 8px}
.running h4{
  margin:8px 0;font-family:var(--digit);font-size:12.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#b9c7ea;
}
.running ul{padding:0;margin:0}
.running li{
  list-style:none;margin:6px 0;padding:7px 10px;border-radius:10px;font-size:15px;color:var(--ink);
  background:rgba(var(--c-rgb),.10);border:1px solid rgba(var(--c-rgb),.28);border-left:4px solid var(--c);
  box-shadow:0 0 14px rgba(var(--c-rgb),.10);
}
.running li b{color:#fff}
.running li.UP{--c:var(--up);--c-rgb:var(--up-rgb)}
.running li.DN{--c:var(--dn);--c-rgb:var(--dn-rgb)}

/* ---------- footer ---------- */
footer{
  position:relative;z-index:1;text-align:center;padding:18px 12px 22px;margin-top:6px;
  font-family:var(--digit);font-size:12px;font-weight:500;letter-spacing:2.5px;color:var(--muted);
}
footer::before{
  content:"";display:block;height:1px;max-width:620px;margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--up),var(--orange),var(--dn),transparent);
  box-shadow:0 0 12px rgba(255,138,31,.55);
}
footer span{color:var(--orange);font-weight:700;text-shadow:0 0 12px rgba(255,138,31,.75)}
</style>
</head>
<body>

<div class="wrap">
  <div class="glass controls">
    <label for="stationSel">📍 Select</label>
    <select id="stationSel"></select>
  </div>

  <div class="grid">
    <section>
      <div class="card dirUP" id="cardUP"></div>
      <div class="card dirDN" id="cardDN"></div>
    </section>

    <section>
      <div class="card mapcard">
        <h3><i class="live"></i>Orange Line Map · Live</h3>
        <svg id="map" viewBox="0 0 480 760"></svg>
        <div class="legend">
          <span><svg width="22" height="22" viewBox="-12 -13 24 26"><polygon points="0,-12 9,9 0,4 -9,9" fill="#2bb8ff" stroke="#fff" stroke-width="1.5"/></svg> UP train (↑ <span id="lgUP">Beleghata</span> towards)</span>
          <span><svg width="22" height="22" viewBox="-12 -13 24 26"><polygon points="0,12 9,-9 0,-4 -9,-9" fill="#c653ff" stroke="#fff" stroke-width="1.5"/></svg> DN train (↓ <span id="lgDN">Kavi Subhash</span> towards)</span>
          <span><i class="sw" style="background:#ffe500;border:2px solid #fff"></i> Interchange</span>
          <span><i class="sw" style="background:transparent;border:2px dashed #7f8fb3"></i> Proposed</span>
          <span>⭕ Dotted ring = selected station</span>
        </div>
        <div class="running" id="runList"></div>
      </div>
    </section>
  </div>
</div>

<footer>© Created by <span>SSE/M/KKSO</span></footer>

    "KKSK": ["8:27:00","8:53:00","9:18:00","9:43:00","10:08:00","10:33:00","10:58:00","11:23:00","11:48:00","12:13:00","12:38:00","13:03:00","13:28:00","13:53:00","14:18:00","14:43:00","15:08:00","15:33:00","15:58:00","16:23:00","16:48:00","17:13:00","17:38:00","18:03:00","18:28:00","18:53:00","19:18:00","19:43:00","20:08:00","20:33:00"],
    "KJNN": ["8:30:00","8:55:20","9:20:20","9:45:20","10:10:20","10:35:20","11:00:20","11:25:20","11:50:20","12:15:20","12:40:20","13:05:20","13:30:20","13:55:20","14:20:20","14:45:20","15:10:20","15:35:20","16:00:20","16:25:20","16:50:20","17:15:20","17:40:20","18:05:20","18:30:20","18:55:20","19:20:20","19:45:20","20:10:20","20:35:20"],
    "KSJR": ["8:33:00","8:58:10","9:23:10","9:48:10","10:13:10","10:38:10","11:03:10","11:28:10","11:53:10","12:18:10","12:43:10","13:08:10","13:33:10","13:58:10","14:23:10","14:48:10","15:13:10","15:38:10","16:03:10","16:28:10","16:53:10","17:18:10","17:43:10","18:08:10","18:33:10","18:58:10","19:23:10","19:48:10","20:13:10","20:38:10"]
  }
}
</script>

<script>
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const dirs = ['UP','DN'];
const OFF = 9;                      // UP/DN track gap on map (px)
let ST, TT, M, offsetSec = 0;
let selected = null;                // default station JSON ("defaultStation") se aata hai = KKSO

const istFmt = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'});
function istSec(){
  const p = istFmt.formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return g('hour')*3600 + g('minute')*60 + g('second');
}
const nowSec = () => (((istSec() + offsetSec) % 86400) + 86400) % 86400;

function toSec(s){
  if(typeof s !== 'string') return null;
  const p = s.trim().split(':').map(Number);
  if(!p.length || p.some(isNaN)) return null;
  return p[0]*3600 + (p[1]||0)*60 + (p[2]||0);
}
const pad = n => String(n).padStart(2,'0');
function fmt(sec){ sec=((Math.round(sec)%86400)+86400)%86400; return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60); }
function fmtCd(sec){
  sec = Math.max(0, Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
/* r = 1 (100%, full gap) -> green ... r = 0 -> dark red */
function cdColor(r){ return `hsl(${Math.round(120*r)},90%,${Math.round(40+16*r)}%)`; }

/* test: page_url?time=08:05:00 */
(function(){
  const q = new URLSearchParams(location.search).get('time');
  if(q){ const t = toSec(q); if(t != null) offsetSec = t - istSec(); }
})();

/* ================= data prepare ================= */
function prepare(){
  const list = ST.stations;
  M = {list, by:{}, times:{UP:{},DN:{}}, seq:{}, trips:{UP:[],DN:[]}};
  list.forEach((s,i)=>{ s.idx=i; M.by[s.code]=s; });
  const act = list.filter(s => s.status === 'active');
  M.first = act[0]; M.last = act[act.length-1];
  M.cfg = Object.assign({defaultHeadwaySec:1500, minTerminalLegSec:150, maxLastLegSec:300, defaultLastLegSec:240}, TT.meta || {});
  M.dwellDef = (typeof ST.defaultDwellSec === 'number') ? ST.defaultDwellSec : 30;
  M.holdDef  = (typeof ST.defaultHoldSec  === 'number') ? ST.defaultHoldSec  : 120;

  dirs.forEach(d=>{
    const tbl = TT[d] || {};
    list.forEach(s => { M.times[d][s.code] = (tbl[s.code] || []).map(toSec); });
  });
  /* UP: first -> (last-1) departures, DN: last -> (first+1) departures. Last station ka arrival calculate hota hai */
  M.seq.UP = act.slice(0,-1);
  M.seq.DN = act.slice(1).reverse();
  buildTrips();

  /* map geometry: UP track (right) & DN track (left) */
  const P = list, n = P.length, N = [];
  for(let i=0;i<n-1;i++){
    const dx=P[i+1].x-P[i].x, dy=P[i+1].y-P[i].y, l=Math.hypot(dx,dy)||1;
    N.push({x:-dy/l, y:dx/l});
  }
  const miter = i => {
    if(i===0) return {x:N[0].x,y:N[0].y,k:1};
    if(i===n-1) return {x:N[n-2].x,y:N[n-2].y,k:1};
    let mx=N[i-1].x+N[i].x, my=N[i-1].y+N[i].y; const l=Math.hypot(mx,my)||1; mx/=l; my/=l;
    const dd = mx*N[i].x+my*N[i].y;
    return {x:mx,y:my,k:Math.min(1/(dd||1),2)};
  };
  M.track = {UP:[],DN:[]};
  for(let i=0;i<n;i++){
    const m = miter(i);
    M.track.UP.push({x:P[i].x+OFF*m.k*m.x, y:P[i].y+OFF*m.k*m.y});
    M.track.DN.push({x:P[i].x-OFF*m.k*m.x, y:P[i].y-OFF*m.k*m.y});
  }
  M.cum = {};
  dirs.forEach(d=>{
    const c=[0];
    for(let i=1;i<n;i++) c.push(c[i-1]+Math.hypot(M.track[d][i].x-M.track[d][i-1].x, M.track[d][i].y-M.track[d][i-1].y));
    M.cum[d]=c;
  });
}

/* Har trip: stops = [{s, arr, dep}] */
function buildTrips(){
  const dw = s => (typeof s.dwellSec === 'number') ? s.dwellSec : M.dwellDef;
  const hd = s => (typeof s.holdSec  === 'number') ? s.holdSec  : M.holdDef;
  const C = M.cfg;

  dirs.forEach(d=>{
    const seq = M.seq[d];
    const n = Math.max(0, ...seq.map(s => M.times[d][s.code].length));
    for(let i=0;i<n;i++){
      const stops = [];
      seq.forEach(s=>{
        const t = M.times[d][s.code][i];
        if(t == null) return;
        let arr;
        if(!stops.length) arr = (s === seq[0]) ? t - hd(s) : t - dw(s);     // origin: holding time
        else arr = Math.min(t, Math.max(t - dw(s), stops[stops.length-1].dep + 5)); // arrival = departure - dwell
        stops.push({s, arr, dep:t});
      });
      M.trips[d].push({d, no:i+1, stops});
    }
  });

  /* last station arrival + next direction pairing (UP train -> DN train, DN train -> UP train) */
  dirs.forEach(d=>{
    const o = d==='UP' ? 'DN' : 'UP';
    const T = d==='UP' ? M.last : M.first;          // terminal jahan ye direction khatam hoti hai
    const opp = M.trips[o], used = new Set();
    const lastDep = tr => tr.stops[tr.stops.length-1].dep;
    const order = M.trips[d].filter(t => t.stops.length).sort((a,b)=>lastDep(a)-lastDep(b));
    order.forEach(tr=>{
      const ld = lastDep(tr);
      let D = null, jb = -1;
      opp.forEach((ot,j)=>{
        if(used.has(j) || !ot.stops.length || ot.stops[0].s !== T) return;
        const dep = ot.stops[0].dep;
        if(dep - hd(T) >= ld + C.minTerminalLegSec && (D === null || dep < D)){ D = dep; jb = j; }
      });
      let arrival;
      if(jb >= 0){
        used.add(jb);
        arrival = Math.min(D - hd(T), ld + C.maxLastLegSec);
        opp[jb].stops[0].arr = arrival;                // next train yahin se stand karti hai
      } else arrival = ld + C.defaultLastLegSec;
      tr.stops.push({s:T, arr:arrival, dep:arrival, final:true});
    });
  });
}

/* ================= train state ================= */
function tripState(tr, now){
  const S = tr.stops;
  if(S.length < 2) return null;
  if(now < S[0].arr || now >= S[S.length-1].arr) return null;
  if(now < S[0].dep) return {st:'stand', k:0, left:S[0].dep-now};
  for(let k=0;k<S.length-1;k++){
    const A=S[k], B=S[k+1];
    if(k>0 && now>=A.arr && now<A.dep) return {st:'dwell', k, left:A.dep-now};
    if(now>=A.dep && now<B.arr) return {st:'run', k, f:(now-A.dep)/(B.arr-A.dep), eta:B.arr-now};
  }
  return null;
}

/* position on the map between station indexes a -> b */
function posAt(d,a,b,f){
  const T=M.track[d], c=M.cum[d];
  const dist = c[a] + (c[b]-c[a])*f;
  const lo=Math.min(a,b), hi=Math.max(a,b);
  let j=lo; while(j<hi-1 && c[j+1] < dist) j++;
  const len = (c[j+1]-c[j]) || 1, t = (dist-c[j])/len;
  const x = T[j].x + (T[j+1].x-T[j].x)*t, y = T[j].y + (T[j+1].y-T[j].y)*t;
  let dx = T[j+1].x-T[j].x, dy = T[j+1].y-T[j].y;
  if(b < a){ dx=-dx; dy=-dy; }
  return {x, y, ang: Math.atan2(dx,-dy)*180/Math.PI};
}

/* ================= cards ================= */
function nextTwo(d,code,now){
  const s = M.by[code];
  if((d==='UP' && s===M.last) || (d==='DN' && s===M.first)) return null;   // terminal: is direction me train nahi
  const e = [];
  (M.times[d][code] || []).forEach((t,i)=>{ if(t != null) e.push({sec:t, trip:i}); });
  if(!e.length) return null;
  e.sort((a,b)=>a.sec-b.sec);
  const all = e.concat(e.map(x=>({sec:x.sec+86400, trip:x.trip, tom:true})));
  const i = all.findIndex(x => x.sec >= now);
  return [all[i], all[i+1] || null];
}

function renderCard(d, now){
  const box = $('card'+d);
  const from = d==='UP' ? M.first : M.last, to = d==='UP' ? M.last : M.first;
  const head = `<div class="hd"><span class="big">${d==='UP'?'▲':'▼'}</span><div><b>${d} LINE</b><small>${from.name} → ${to.name}</small></div></div>`;
  const nt = nextTwo(d, selected, now);
  if(!nt){ box.innerHTML = head + `<div class="na">N/A</div>`; return null; }
  const [a,b] = nt;
  const ca = a.sec - now;
  const full = b ? (b.sec - a.sec) : M.cfg.defaultHeadwaySec;      // Time2 - Time1 = 100%
  const r = Math.max(0, Math.min(1, ca/full)), col = cdColor(r);
  const tom = x => x && x.tom ? '<span class="tag">Tomorrow</span>' : '';
  box.innerHTML = head + `
    <div class="split">
      <div class="p1">
        <div class="t1">${fmt(a.sec)}</div>
        <div class="cd" style="color:${col}">${fmtCd(ca)}${tom(a)}</div>
        <div class="bar"><i style="width:${(r*100).toFixed(1)}%;background:${col};color:${col}"></i></div>
      </div>
      <div class="p2"><div class="t2">${b ? fmt(b.sec) : '—'}${tom(b)}</div></div>
    </div>`;
  return a.tom ? null : d+':'+a.trip;
}

/* ================= map ================= */
function buildMap(){
  const L = M.list;
  /* NOTE: filters userSpaceOnUse -> vertical (zero-width) lines bhi sahi render hoti hain */
  let h = `<defs>
    <filter id="gUP" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2bb8ff" flood-opacity=".95"/></filter>
    <filter id="gDN" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c653ff" flood-opacity=".95"/></filter>
    <filter id="gOR" filterUnits="userSpaceOnUse" x="0" y="0" width="480" height="760"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff8a1f" flood-opacity=".85"/></filter>
  </defs>`;

  /* active segments -> ek hi path (continuous orange line), proposed segments -> dashed grey */
  let dAct = '', dOff = '';
  for(let i=0;i<L.length-1;i++){
    const a=L[i], b=L[i+1];
    const seg = `M${a.x} ${a.y}L${b.x} ${b.y}`;
    if(a.status==='active' && b.status==='active') dAct += seg; else dOff += seg;
  }
  if(dOff){
    h += `<path d="${dOff}" fill="none" stroke="#5b6785" stroke-opacity=".18" stroke-width="30" stroke-linecap="round"/>`;
    h += `<path d="${dOff}" fill="none" stroke="#5b6785" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>`;
  }
  if(dAct){
    h += `<path d="${dAct}" fill="none" stroke="#ff8a1f" stroke-opacity=".14" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`;
    h += `<path d="${dAct}" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#gOR)"/>`;
  }
  /* UP / DN tracks */
  for(let i=0;i<L.length-1;i++){
    if(L[i].status==='active' && L[i+1].status==='active') dirs.forEach(d=>{
      const p=M.track[d][i], q=M.track[d][i+1];
      h += `<line class="trk t${d}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`;
    });
  }
  /* stations */
  L.forEach(s=>{
    const off = s.status!=='active', ic = !!s.interchange;
    const icCol = s.interchangeColor || '#ffe500';
    let sub = '';
    if(ic)  sub += `<tspan style="fill:${icCol}">⇄ ${s.interchange}</tspan>`;
    if(ic && off) sub += ' · ';
    if(off) sub += 'Proposed';
    h += `<g class="stn ${off?'off':''}" data-code="${s.code}" ${off?'opacity=".85"':''}>
      <circle class="pulse" cx="${s.x}" cy="${s.y}" r="13"/>
      <circle cx="${s.x}" cy="${s.y}" r="12" fill="${ic?'#ffe500':'#0a1228'}" stroke="${ic?'#ffffff':(off?'#8a5a2a':'#ff8a1f')}" stroke-width="${ic?3.5:4}" ${off?'stroke-dasharray="4 3"':''} ${off?'':'filter="url(#gOR)"'}/>
      <text class="sn" x="${s.x+40}" y="${s.y-1}">${s.name} <tspan class="sc">${s.code}</tspan></text>
      ${sub ? `<text class="si" x="${s.x+40}" y="${s.y+13}">${sub}</text>` : ''}
      <rect x="${s.x-14}" y="${s.y-14}" width="300" height="28" fill="transparent"/>
    </g>`;
  });
  h += '<g id="trains"></g>';
  $('map').innerHTML = h;
  $('map').querySelectorAll('.stn').forEach(g=>{
    g.addEventListener('click',()=>{
      const s=M.by[g.dataset.code];
      if(s.status==='active'){ selected=s.code; $('stationSel').value=s.code; tick(); }
    });
  });
  $('lgUP').textContent = M.last.name;
  $('lgDN').textContent = M.first.name;
}

function drawTrains(now, tracked){
  let h='', running=[];
  dirs.forEach(d=>{
    M.trips[d].forEach((tr,i)=>{
      const st = tripState(tr, now);
      if(!st) return;
      const S = tr.stops;
      const f = st.st==='run' ? st.f : 0;
      const p = posAt(d, S[st.k].s.idx, S[st.k+1].s.idx, f);
      const op = st.st==='stand' ? .6 : 1;
      const trk = tracked.has(d+':'+i);
      h += `<g opacity="${op}"><g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.ang.toFixed(1)})" filter="url(#g${d})">
              ${trk?`<circle class="ring r${d}" r="17"/>`:''}
              <polygon class="a${d}" points="0,-12 9,9 0,4 -9,9" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            </g>
            <text class="l${d}" x="${(p.x+(d==='UP'?15:-15)).toFixed(1)}" y="${(p.y+4).toFixed(1)}" text-anchor="${d==='UP'?'start':'end'}" font-size="11" font-weight="800">${d[0]}${tr.no}</text></g>`;
      if(st.st !== 'stand') running.push({d, tr, st});
    });
  });
  $('trains').innerHTML = h;
  let lh = `<h4>🚆 Now Running: ${running.length}</h4><ul>`;
  running.sort((a,b)=>(a.d===b.d ? 0 : a.d==='UP' ? -1 : 1) || a.tr.no-b.tr.no).forEach(r=>{
    const S = r.tr.stops, k = r.st.k;
    const txt = r.st.st==='run'
      ? `${S[k].s.name} → ${S[k+1].s.name} · <b>${fmtCd(r.st.eta)}</b>`
      : `At ${S[k].s.name} · <b>${fmtCd(r.st.left)}</b>`;
    lh += `<li class="${r.d}">${r.d==='UP'?'▲':'▼'} <b>${r.d[0]}${r.tr.no}</b> · ${txt}</li>`;
  });
  $('runList').innerHTML = lh + '</ul>';
}

/* ================= main loop ================= */
function tick(){
  if(!M) return;
  const now = nowSec();
  const tracked = new Set();
  dirs.forEach(d=>{ const k = renderCard(d, now); if(k) tracked.add(k); });
  drawTrains(now, tracked);
  document.querySelectorAll('.stn').forEach(g=>g.classList.toggle('sel', g.dataset.code===selected));
}

function fillSelect(){
  const sel = $('stationSel'); sel.innerHTML='';
  M.list.forEach(s=>{
    const o=document.createElement('option');
    o.value=s.code;
    o.textContent = `${s.name} (${s.code})${s.interchange?' ⇄':''}${s.status!=='active'?' — Proposed':''}`;
    if(s.status!=='active') o.disabled=true;
    sel.appendChild(o);
  });
  /* Default: KAVI SUBHASH (KKSO) – har baar page open/refresh par yahi select hoga */
  const def = M.by[ST.defaultStation || 'KKSO'];
  selected = (def && def.status==='active') ? def.code : M.first.code;
  sel.value = selected;
}
$('stationSel').addEventListener('change',e=>{ selected=e.target.value; tick(); });

async function init(){
  let st=null, tt=null;
  try{   /* same folder me stations.json + timetable.json ho to wahi use hoga, warna HTML ke andar wala JSON */
    const [a,b] = await Promise.all([fetch('stations.json',{cache:'no-store'}), fetch('timetable.json',{cache:'no-store'})]);
    if(a.ok && b.ok){ st = await a.json(); tt = await b.json(); }
  }catch(e){ st=null; tt=null; }
  if(!st || !tt || !Array.isArray(st.stations) || !tt.UP || !tt.DN){
    st = JSON.parse($('stationsJson').textContent);
    tt = JSON.parse($('timetableJson').textContent);
  }
  ST=st; TT=tt;
  prepare(); fillSelect(); buildMap(); tick();
  setInterval(tick,1000);
}
init();
</script>
